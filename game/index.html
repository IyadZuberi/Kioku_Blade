<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kioku - Blades That Remember</title>
    <meta name="description" content="A samurai duel in the browser where the general remembers how you fight. Deflect his blade, break his posture, land the deathblow, then face the version of him you taught." />
    <meta name="theme-color" content="#120d0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kioku" />
    <meta property="og:title" content="Kioku - Blades That Remember" />
    <meta property="og:description" content="A samurai duel where the general remembers how you fight." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kioku - Blades That Remember" />
    <meta name="twitter:description" content="A samurai duel where the general remembers how you fight." />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c10; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      body.fighting #game { cursor: none; }
    </style>
    <style>
      #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4vmin;
        background: radial-gradient(120% 90% at 50% 105%, #7a3b2a 0%, #2a1a22 38%, #0d0c10 72%); color: #efe7da; overflow: hidden; transition: opacity 0.7s ease; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .sun { position: absolute; left: 50%; bottom: -6vmin; width: 40vmin; height: 40vmin; margin-left: -20vmin; border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #fbe3c4 0%, #f2b27d 45%, #d9683f 100%);        transform: translateY(0); animation: sunrise 7s cubic-bezier(.2,.7,.2,1) both; }
      #boot .kanji, #boot .name, #boot .stroke, #boot .msg, #boot .late { position: relative; margin: 0; }
      #boot .kanji { font: 700 17vmin/1 "Yu Mincho","YuMincho","Hiragino Mincho ProN","MS Mincho","Noto Serif JP",serif; letter-spacing: 0.06em; text-shadow: 0 0 3vmin rgba(0,0,0,0.55); }
      #boot .name { font: 600 3.2vmin/1 "Palatino Linotype","Book Antiqua",Georgia,serif; letter-spacing: 0.7em; margin-right: -0.7em; color: #ece3d4; }
      #boot .stroke { width: min(46vw, 420px); height: 3px; background: rgba(236,226,214,0.16); overflow: hidden; margin-top: 2vmin; }
      #boot .stroke i { display: block; width: 100%; height: 100%; background: #c4372a; animation: breathe 2.4s ease-in-out infinite; }
      #boot .msg { font: italic 2.1vmin/1.4 Georgia,serif; color: #d9cdb9; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
      #boot .late { font: 1.9vmin/1.4 Georgia,serif; color: #e7b9a8; opacity: 0; max-width: 60ch; text-align: center; padding: 0 6vw; animation: fadein 0.6s ease 25s forwards; }
      @keyframes sunrise { from { transform: translateY(46vmin); } to { transform: translateY(0); } }
      #boot .sun { z-index: 0; }
      /* the sun's light on the haze: a soft gradient disc behind it, not a drop shadow */
      #boot .sun::before { content: ""; position: absolute; inset: -40%; z-index: -1; border-radius: 50%; background: radial-gradient(circle, rgba(240,150,90,0.30) 0%, rgba(240,150,90,0) 62%); }
      #boot .kanji, #boot .name, #boot .stroke, #boot .msg, #boot .late { z-index: 1; }
      @keyframes breathe { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @keyframes fadein { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .sun, #boot .stroke i { animation: none; } }
    </style>  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot" role="status" aria-live="polite">
      <div class="sun" aria-hidden="true"></div>
      <h1 class="kanji" lang="ja">記憶</h1>
      <p class="name">Kioku</p>
      <div class="stroke" aria-hidden="true"><i></i></div>
      <p class="msg">Loading the three generals and the grounds where they wait.</p>
      <p class="late">Still loading. This game needs a desktop browser with WebGL and about 35 MB of data.</p>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
