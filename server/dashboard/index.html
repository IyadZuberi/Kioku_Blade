<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The General — version scoreboard</title>
<style>
  :root { --bg:#0d0c10; --ink:#efe7da; --dim:#8f8472; --red:#b3261a; --line:#2a2630; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 "Palatino Linotype", Georgia, serif; padding:28px clamp(16px,4vw,56px); }
  h1 { font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  table { border-collapse:collapse; width:100%; max-width:1100px; }
  th, td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:400; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  td.label { font-weight:600; }
  tr.v td.label::after { content:" trained overnight"; color:var(--dim); font-weight:400; font-size:12px; }
  .note { color:var(--dim); font-size:12px; text-align:left; max-width:260px; }
  .box { margin-top:26px; padding:14px 18px; border-left:3px solid var(--red); background:#15131a; max-width:1100px; font-size:14px; }
  .empty { color:var(--dim); }
  @media (max-width:700px) { .hide-s { display:none; } }
</style>
</head>
<body>
  <h1>The General's brain: version scoreboard</h1>
  <div class="sub">Held-out set, 60 synthetic fights, never stored by Mubit. Every number is from a real run; nothing is invented.</div>
  <div id="t"></div>
  <div class="box" id="calls"></div>
<script>
const pct = (x) => x === "" || x == null ? "—" : Math.round(x * 100) + "%";
const num = (x, d = 0) => x === "" || x == null ? "—" : Number(x).toFixed(d);
async function load() {
  let j;
  try { j = await (await fetch("/api/stats")).json(); } catch { document.getElementById("t").innerHTML = '<span class="empty">server not reachable</span>'; return; }
  const rows = j.rows;
  document.getElementById("t").innerHTML = rows.length ? `<table><thead><tr>
      <th>Version</th><th>Valid plans</th><th>Right counter</th><th>Agrees with provider</th><th class="hide-s">Bound violations</th>
      <th>p50 ms</th><th class="hide-s">p95 ms</th><th>Cost / 1,000</th><th class="hide-s">Notes</th></tr></thead><tbody>` +
    rows.map((r) => `<tr class="${/^v\d/.test(r.label) ? "v" : ""}"><td class="label">${esc(r.label)}</td><td>${pct(r.valid_rate)}</td><td>${pct(r.target_rate)}</td><td>${pct(r.agree_rate)}</td>
      <td class="hide-s">${r.violations}</td><td>${num(r.p50_ms)}</td><td class="hide-s">${num(r.p95_ms)}</td><td>${r.cost_per_1k === "" ? "—" : "$" + num(r.cost_per_1k, 2)}</td><td class="note hide-s">${esc(r.notes)}</td></tr>`).join("") +
    `</tbody></table>` : '<span class="empty">No evaluation rows yet. Run the eval script.</span>';
  const c = j.calls;
  const served = Object.entries(c.byServedBy).map(([k, v]) => `${esc(k)}: ${v.n} calls, p50 ${v.p50} ms, p95 ${v.p95} ms`).join(" · ") || "none yet";
  document.getElementById("calls").innerHTML = `<b>What Mubit saw:</b> ${c.total} logged calls (${c.ok} ok). By "served by": ${served}. Last request id: ${esc(c.lastRequestId || "—")}.`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
load(); setInterval(load, 15000);
</script>
</body>
</html>
